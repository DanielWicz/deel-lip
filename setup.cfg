[flake8]
# Use black line length:
max-line-length = 88
extend-ignore =
    # See https://github.com/PyCQA/pycodestyle/issues/373
    E203, E231
per-file-ignores =
	*/__init__.py: F401

[tox:tox]
envlist =
    py{38,39,310,311}
    py{38,39,310,311}-lint

[testenv]
deps =
    packaging
    pytest
    torch>=2.0.0
commands =
    pytest tests

[testenv:py{38,39,310,311}-lint]
skip_install = true
deps =
    black
    flake8
    flake8-black
    git+https://github.com/numpy/numpy-stubs.git
commands =
    black --check --diff setup.py deel tests
    flake8 deel tests
